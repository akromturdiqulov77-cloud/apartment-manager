<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Apartment Manager</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root{--bg:#fff;--fg:#0a0a0a;--mute:#737373;--line:#e5e5e5;--soft:#f5f5f5;--r:12px}
  @media (prefers-color-scheme:dark){:root:not(.light){--bg:#0a0a0a;--fg:#fafafa;--mute:#8a8a8a;--line:#262626;--soft:#161616}}
  :root.dark{--bg:#0a0a0a;--fg:#fafafa;--mute:#8a8a8a;--line:#262626;--soft:#161616}
  :root{color-scheme:light}:root.dark{color-scheme:dark}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--fg);font-size:14px;-webkit-font-smoothing:antialiased}
  .num{font-family:'JetBrains Mono',monospace;font-variant-numeric:tabular-nums}
  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
  .app{display:flex;min-height:100vh}
  aside{width:220px;border-right:1px solid var(--line);padding:20px 12px;position:sticky;top:0;height:100vh;flex-shrink:0}
  .logo{font-weight:700;font-size:15px;padding:0 10px 24px;letter-spacing:-.02em;display:flex;align-items:center;gap:8px}
  .logo i{width:22px;height:22px;background:var(--fg);border-radius:6px;display:inline-block}
  nav button{display:flex;align-items:center;gap:10px;width:100%;padding:9px 10px;border-radius:8px;color:var(--mute);font-weight:500;margin-bottom:2px}
  nav button:hover{background:var(--soft);color:var(--fg)}
  nav button.on{background:var(--fg);color:var(--bg)}
  nav svg{width:18px;height:18px;flex-shrink:0}
  main{flex:1;min-width:0;padding:28px 32px 100px}
  header{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin-bottom:24px;flex-wrap:wrap}
  h1{font-size:24px;font-weight:700;letter-spacing:-.03em}
  .sub{color:var(--mute);margin-top:4px}
  .btn{background:var(--fg);color:var(--bg);padding:9px 14px;border-radius:8px;font-weight:600}
  .btn.ghost{background:none;color:var(--fg);border:1px solid var(--line)}
  .btn.sm{padding:5px 10px;font-size:12px}
  .grid{display:grid;gap:12px}
  .k4{grid-template-columns:repeat(4,1fr)}
  .card{border:1px solid var(--line);border-radius:var(--r);padding:18px}
  .kpi .l{color:var(--mute);font-size:12px;font-weight:500;text-transform:uppercase;letter-spacing:.04em}
  .kpi .v{font-size:26px;font-weight:600;margin-top:8px;letter-spacing:-.02em}
  .kpi .h{color:var(--mute);font-size:12px;margin-top:4px}
  .two{grid-template-columns:1.6fr 1fr;margin-top:12px}
  .two.eq{grid-template-columns:1fr 1fr}
  .ct{font-weight:600;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center}
  .ct span{color:var(--mute);font-weight:400;font-size:12px}
  .rooms{grid-template-columns:repeat(auto-fill,minmax(130px,1fr))}
  .room{border:1px solid var(--line);border-radius:10px;padding:12px;text-align:left;transition:border-color .15s}
  .room:hover{border-color:var(--fg)}
  .room .n{font-weight:700;font-size:18px}
  .room .t{color:var(--mute);font-size:12px;margin-top:2px}
  .room .g{font-size:12px;margin-top:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-height:15px}
  .room.occupied{background:var(--fg);color:var(--bg);border-color:var(--fg)}
  .room.occupied .t{color:var(--bg);opacity:.6}
  .room.cleaning{background:repeating-linear-gradient(135deg,var(--soft) 0 6px,var(--bg) 6px 12px)}
  .room.maintenance{opacity:.45;border-style:dashed}
  .pill{display:inline-block;padding:2px 8px;border-radius:99px;font-size:11px;font-weight:600;border:1px solid var(--line);white-space:nowrap}
  .pill.dark{background:var(--fg);color:var(--bg);border-color:var(--fg)}
  .pill.dash{border-style:dashed;color:var(--mute)}
  .legend{display:flex;gap:14px;flex-wrap:wrap;color:var(--mute);font-size:12px;margin-bottom:16px}
  .legend b{display:inline-block;width:10px;height:10px;border-radius:3px;border:1px solid var(--fg);margin-right:6px;vertical-align:-1px}
  .filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
  .chip{padding:6px 12px;border-radius:99px;border:1px solid var(--line);font-weight:500;font-size:13px}
  .chip.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
  table{width:100%;border-collapse:collapse}
  th{text-align:left;color:var(--mute);font-weight:500;font-size:12px;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
  td{padding:12px;white-space:nowrap;border-bottom:1px solid var(--line);vertical-align:middle}
  tr:last-child td{border-bottom:0}
  td.r,th.r{text-align:right}
  .tw{border:1px solid var(--line);border-radius:var(--r);overflow-x:auto}
  .muted{color:var(--mute)}
  .bar{display:flex;align-items:center;gap:10px;margin-bottom:10px;font-size:13px}
  .bar .lb{width:90px;flex-shrink:0}
  .bar .tr{flex:1;height:8px;background:var(--soft);border-radius:4px;overflow:hidden}
  .bar .fl{height:100%;background:var(--fg);border-radius:4px}
  .bar .vl{width:56px;text-align:right}
  input,select,textarea{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 11px;width:100%}
  input:focus,select:focus{outline:none;border-color:var(--fg)}
  label{display:block;font-size:12px;color:var(--mute);font-weight:500;margin:12px 0 5px}
  .search{max-width:280px}
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
  .modal.open{display:flex}
  .sheet{background:var(--bg);border-radius:16px;width:100%;max-width:440px;padding:22px;max-height:90vh;overflow:auto;border:1px solid var(--line)}
  .sheet h3{font-size:18px;letter-spacing:-.02em}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .acts{display:flex;gap:8px;justify-content:flex-end;margin-top:20px;flex-wrap:wrap}
  .err{color:#d00;font-size:13px;margin-top:10px;min-height:18px}
  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:500;transition:transform .25s,opacity .25s;z-index:60;opacity:0;pointer-events:none}
  .toast.show{transform:translateX(-50%) translateY(0);opacity:1}
  .seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;padding:2px}
  .seg button{padding:5px 12px;border-radius:6px;font-size:13px;font-weight:500;color:var(--mute)}
  .seg button.on{background:var(--fg);color:var(--bg)}
  .kv{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line)}
  .kv:last-child{border:0}
  .mobnav{display:none}
  .badge{position:fixed;top:12px;right:14px;font-size:11px;color:var(--mute);border:1px solid var(--line);padding:3px 8px;border-radius:99px;background:var(--bg);z-index:5}
  @media (max-width:860px){
    aside{display:none}
    main{padding:20px 16px 96px}
    .k4{grid-template-columns:1fr 1fr}
    .two,.two.eq{grid-template-columns:1fr}
    .kpi .v{font-size:22px}
    .hide-m{display:none}
    .mobnav{display:flex;position:fixed;bottom:0;left:0;right:0;background:var(--bg);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:40;justify-content:space-around}
    .mobnav button{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10px;color:var(--mute);padding:6px 4px;flex:1;font-weight:500}
    .mobnav button.on{color:var(--fg)}
    .mobnav svg{width:20px;height:20px}
    .search{max-width:none}
  }

  .nw{white-space:nowrap}
  aside{display:flex;flex-direction:column}
  .side-foot{margin-top:auto;padding:0 6px}
  .side-foot .muted{font-size:11px;margin-top:8px;padding:0 4px}
  .seg.lang button{padding:4px 10px;font-size:12px}
  .mtop{display:none}
  .mobnav button span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  @media (max-width:860px){ aside{display:none} .mtop{display:flex;justify-content:flex-end;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap} }
  .gear{padding:5px 10px;font-size:14px;line-height:1}
  .side-row{display:flex;gap:8px;align-items:center;margin-bottom:8px}
</style>
</head>

  <main id="main"></main>

const fromView = (v) => { v = +v || 0; return cur()==='USD' ? Math.round(v*100)/100 : Math.round(v / rate() * 100)/100; };
const fmtNum = (n, dec) => { const s = Math.abs(n).toFixed(dec).split('.'); s[0] = s[0].replace(/\B(?=(\d{3})+(?!\d))/g, ' '); return (n<0?'−':'') + (dec && s[1] !== '00' ? s.join('.') : s[0]); };
const curLabel = () => cur()==='USD' ? '$' : t('currency');
// money(usd) — valyuta belgisi bilan; amt(usd) — faqat raqam (input uchun)
const money = (usd) => { const v = toView(usd); return cur()==='USD' ? '$' + fmtNum(v, 2) : fmtNum(Math.round(v), 0) + ' ' + t('currency'); };
const amt = (usd) => { const v = toView(usd); return cur()==='USD' ? String(Math.round(v*100)/100) : String(Math.round(v)); };
const short = (usd) => { const v = toView(usd); if (cur()==='UZS' && v>=1e6) return (v/1e6).toFixed(v>=1e7?0:1).replace('.0','')+' '+t('mln')+' '+t('currency'); return money(usd); };
const fmtD = (s) => { const d=new Date(s); return d.getDate()+' '+L[lang].mons[d.getMonth()]; };
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

// ---------- Ma'lumotlar: 24 ta xona (11–18, 21–28, 31–38) ----------
// Standart (2 kishi): 11 12 15 16 21 22 25 26 31 32 35 36 · Katta (3 kishi): qolgan 12 tasi
const KEY = 'apartment-manager-v2';
const LARGE = new Set(['13','14','17','18','23','24','27','28','33','34','37','38']);
const roomDefaults = (num) => LARGE.has(String(num)) ? { type:'large', capacity:3 } : { type:'standard', capacity:2 };
function fresh(){ const d={ settings:{ currency:'USD', rate:DEFAULT_RATE }, rooms:[], guests:[], bookings:[], payments:[], expenses:[] }; let id=1;
  for (let f=1; f<=3; f++) for (let n=1; n<=8; n++) { const num=''+f+n; d.rooms.push({ id:id++, number:num, ...roomDefaults(num), floor:f, price_daily:0, price_weekly:0, price_monthly:0, status:'free' }); }
  return d; }
// Eski versiyadagi ma'lumotlarga xona turi va sig'imini qo'shish (narxlar va bronlar saqlanadi)
function migrate(d){ if (!d.settings) d.settings = { currency:'USD', rate:DEFAULT_RATE }; (d.rooms||[]).forEach(r => { if (r.capacity == null) { const x = roomDefaults(r.number); r.capacity = x.capacity; if (!r.type || r.type === 'Standart') r.type = x.type; } }); return d; }
let db; try { db = migrate(JSON.parse(LS.get(KEY)) || fresh()); } catch(e){ db = fresh(); }

// Telegram CloudStorage: foydalanuvchining barcha Telegram qurilmalarida bir xil ma'lumot.
// Har bir qiymat 4096 belgigacha bo'lgani uchun JSON bo'laklarga bo'linadi.
const cloud = tgAtLeast('6.9') && tg.CloudStorage ? tg.CloudStorage : null;
const CHUNK = 3500;
let cloudTimer = null, lastCloud = '';
function cloudSave(){
  if (!cloud) return;
  clearTimeout(cloudTimer);
  cloudTimer = setTimeout(() => {
    const json = JSON.stringify(db); if (json === lastCloud) return; lastCloud = json;
    const parts = []; for (let i=0; i<json.length; i+=CHUNK) parts.push(json.slice(i, i+CHUNK));
    let left = parts.length;
    parts.forEach((p,i) => cloud.setItem('d'+i, p, () => { if (--left === 0) cloud.setItem('n', String(parts.length)); }));
  }, 600);
}
function cloudLoad(){
  if (!cloud) return;
  cloud.getItem('n', (err, n) => {
    n = parseInt(n, 10);
    if (err || !n) { cloudSave(); return; }            // bulut bo'sh: mahalliy ma'lumotni yuklab qo'yamiz
    const keys = Array.from({length:n}, (_,i) => 'd'+i);
    cloud.getItems(keys, (e, vals) => {
      if (e || !vals) return;
      try {
        const json = keys.map(k => vals[k] || '').join('');
        const data = JSON.parse(json);
        if (data && Array.isArray(data.rooms)) { db = migrate(data); lastCloud = json; LS.set(KEY, json); render(); }
      } catch (x) {}
    });
  });
}
function save(){ LS.set(KEY, JSON.stringify(db)); cloudSave(); }
function resetAll(){ const keep = db.settings; db = fresh(); db.settings = keep; closeM(); render(); toast(t('resetDone')); }

const balanceOf = (b) => b.status==='cancelled' ? 0 : b.total - paidOf(b.id);
const overlaps = (rid,a,b,skip) => db.bookings.some(x => x.id!==skip && x.room_id===rid && x.status!=='cancelled' && x.status!=='checked_out' && x.check_in < b && a < x.check_out);
const nextId = (arr) => Math.max(0, ...arr.map(x=>x.id)) + 1;
function calcPrice(r,a,b){ const n=nights(a,b);
  if (n>=30 && r.price_monthly) return Math.floor(n/30)*r.price_monthly + (n%30)*r.price_daily;
  if (n>=7 && r.price_weekly) return Math.floor(n/7)*r.price_weekly + (n%7)*r.price_daily;
  return n*r.price_daily; }
const tariff = (r,n) => n>=30&&r.price_monthly ? 'tariff_m' : n>=7&&r.price_weekly ? 'tariff_w' : 'tariff_d';

function lineChart(pts){
  const W=560,H=180,P=36;
  const x=(i)=>P+i*(W-P*2)/(pts.length-1), y=(v)=>H-P-(v/100)*(H-P*2);
  const path = pts.map((p,i)=>(i?'L':'M')+x(i).toFixed(1)+' '+y(p.v).toFixed(1)).join(' ');
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block">
    ${[0,50,100].map(v=>`<line x1="${P}" x2="${W-P}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${P-6}" y="${y(v)+4}" font-size="10" text-anchor="end" fill="var(--mute)">${v}%</text>`).join('')}
    <path d="${path} L${x(pts.length-1)} ${H-P} L${x(0)} ${H-P} Z" fill="var(--fg)" opacity=".06"/><path d="${path}" fill="none" stroke="var(--fg)" stroke-width="2"/>
    ${pts.map((p,i)=>`<circle cx="${x(i)}" cy="${y(p.v)}" r="3" fill="var(--bg)" stroke="var(--fg)" stroke-width="1.5"><title>${fmtD(p.d)}: ${p.v}%</title></circle>`).join('')}
    ${pts.map((p,i)=>i%3===0?`<text x="${x(i)}" y="${H-8}" font-size="10" text-anchor="middle" fill="var(--mute)">${fmtD(p.d)}</text>`:'').join('')}
  </svg>`;
}

}

function Finance(){
  const from = addD(-30);
  const inc = db.payments.filter(p=>p.date>=from).reduce((s,p)=>s+p.amount,0);
  const exp = db.expenses.filter(e=>e.date>=from).reduce((s,e)=>s+e.amount,0);
  const debts = db.bookings.filter(b=>balanceOf(b)>0);
  const bk = (id) => db.bookings.find(b=>b.id===id) || {};
  const tx = [...db.payments.map(p=>({d:p.date, t:`${(room(bk(p.booking_id).room_id)||{}).number||'—'} · ${esc(guest(bk(p.booking_id).guest_id).full_name)}`, s:t('m_'+p.method), a:p.amount})),
              ...db.expenses.map(e=>({d:e.date, t:esc(e.note||catName(e.category)), s:catName(e.category), a:-e.amount}))].sort((a,b)=>a.d<b.d?1:-1);
  return head(t('nav_finance'), t('finSub'), `<button class="btn ghost" onclick="newExpense()">${t('addExpense')}</button>`) + `
  <div class="grid k4">
    <div class="card kpi"><div class="l">${t('income')}</div><div class="v num">${short(inc)}</div></div>
    <div class="card kpi"><div class="l">${t('expenses')}</div><div class="v num">${short(exp)}</div></div>
    <div class="card kpi"><div class="l">${t('profit')}</div><div class="v num">${short(inc-exp)}</div></div>
    <div class="card kpi"><div class="l">${t('debt')}</div><div class="v num">${short(debts.reduce((s,b)=>s+balanceOf(b),0))}</div><div class="h">${t('nBookings',debts.length)}</div></div>
  </div>
  <div class="grid two">
    <div class="card"><div class="ct">${t('history')}</div>${tx.slice(0,15).map(x=>`<div class="kv"><span><span class="muted num">${fmtD(x.d)}</span> &nbsp;${x.t} <span class="muted">· ${x.s}</span></span><b class="num nw">${x.a>0?'+':'−'}${money(Math.abs(x.a))}</b></div>`).join('') || `<div class="muted">${t('noTx')}</div>`}</div>
    <div class="card"><div class="ct">${t('debtors')}</div>${debts.map(b=>`<div class="kv"><span><b>${room(b.room_id).number}</b> · ${esc(guest(b.guest_id).full_name)}</span><button class="btn sm ghost num" onclick="paySheet(${b.id})">${money(balanceOf(b))}</button></div>`).join('') || `<div class="muted">${t('noDebt')}</div>`}</div>
  </div>`;
}

function Reports(){
  const n = { day:14, week:8, month:6 }[period];
  const start = (d) => { const x=new Date(d); x.setHours(0,0,0,0);
    if (period==='week') x.setDate(x.getDate()-((x.getDay()+6)%7));
    if (period==='month') x.setDate(1);
    return iso(x); };
  const keys = []; let c = new Date(start(today));
  for (let i=0;i<n;i++){ keys.unshift(iso(c)); c = period==='day' ? new Date(c.getTime()-DAY) : period==='week' ? new Date(c.getTime()-7*DAY) : new Date(c.getFullYear(),c.getMonth()-1,1); }
  const rows = keys.map(k=>({ k, inc: db.payments.filter(p=>start(p.date)===k).reduce((s,p)=>s+p.amount,0), exp: db.expenses.filter(e=>start(e.date)===k).reduce((s,e)=>s+e.amount,0) }));
  const max = Math.max(1,...rows.map(r=>Math.max(r.inc,r.exp)));
  const W=560,H=200,P=24,bw=(W-P*2)/rows.length;
  const label = (k) => period==='month' ? L[lang].mons[new Date(k).getMonth()] : fmtD(k);
  const chart = `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block">
    <line x1="${P}" x2="${W-P}" y1="${H-P}" y2="${H-P}" stroke="var(--line)"/>
    ${rows.map((r,i)=>{ const x=P+i*bw, h1=(r.inc/max)*(H-P*2), h2=(r.exp/max)*(H-P*2), w=Math.min(14,bw/3);
      return `<rect x="${x+bw/2-w-1}" y="${H-P-h1}" width="${w}" height="${h1}" rx="2" fill="var(--fg)"><title>${t('income')}: ${money(r.inc)}</title></rect>
              <rect x="${x+bw/2+1}" y="${H-P-h2}" width="${w}" height="${h2}" rx="2" fill="none" stroke="var(--fg)" stroke-width="1.2"><title>${t('expenses')}: ${money(r.exp)}</title></rect>
              ${(rows.length<=8||i%2===0)?`<text x="${x+bw/2}" y="${H-8}" font-size="10" text-anchor="middle" fill="var(--mute)">${label(r.k)}</text>`:''}`; }).join('')}
  </svg>`;
  const src = {}; db.bookings.filter(b=>b.status!=='cancelled').forEach(b=>{ src[b.source]=src[b.source]||{n:0,s:0}; src[b.source].n++; src[b.source].s+=b.total; });
  const smax = Math.max(1,...Object.values(src).map(v=>v.s));
  return head(t('nav_reports'), t('repSub'), `<div class="seg">${['day','week','month'].map(k=>`<button class="${period===k?'on':''}" onclick="period='${k}';render()">${t('p_'+k)}</button>`).join('')}</div>`) + `
  <div class="card"><div class="ct">${t('incExp')} <span>■ ${t('lg_inc')} &nbsp; □ ${t('lg_exp')}</span></div>${chart}</div>
  <div class="grid two">
    <div class="tw"><table><thead><tr><th>${t('period')}</th><th class="r">${t('income')}</th><th class="r">${t('expenses')}</th><th class="r">${t('profit')}</th></tr></thead><tbody>
      ${rows.slice().reverse().map(r=>`<tr><td>${label(r.k)}</td><td class="r num">${money(r.inc)}</td><td class="r num">${money(r.exp)}</td><td class="r num"><b>${money(r.inc-r.exp)}</b></td></tr>`).join('')}
    </tbody></table></div>
    <div class="card"><div class="ct">${t('sources')} <span>${t('byRevenue')}</span></div>
      ${Object.entries(src).sort((a,b)=>b[1].s-a[1].s).map(([k,v])=>`<div class="bar"><span class="lb">${esc(srcName(k))}</span><div class="tr"><div class="fl" style="width:${100*v.s/smax}%"></div></div><span class="vl num">${short(v.s)}</span></div>`).join('') || `<div class="muted">${t('noSources')}</div>`}
    </div>
  </div>`;
}

// ---------- Modal oynalar ----------
function openM(html){ document.getElementById('sheet').innerHTML = html; document.getElementById('modal').classList.add('open'); if (tgAtLeast('6.1')) try { tg.BackButton.show(); } catch(e){} }
function closeM(){ document.getElementById('modal').classList.remove('open'); if (tgAtLeast('6.1')) try { tg.BackButton.hide(); } catch(e){} }
document.getElementById('modal').addEventListener('click', e => { if (e.target.id==='modal') closeM(); });
function toast(msg){ const el=document.getElementById('toast'); el.textContent=msg; el.classList.add('show'); clearTimeout(toast.t); toast.t=setTimeout(()=>el.classList.remove('show'),2200);
  if (tgAtLeast('6.1')) try { tg.HapticFeedback.notificationOccurred('success'); } catch(e){} }
const $ = (id) => document.getElementById(id);

function roomSheet(rid){
  const r = room(rid); const bs = db.bookings.filter(b=>b.room_id===rid && b.status!=='cancelled').sort((a,b)=>a.check_in<b.check_in?1:-1).slice(0,4);
  openM(`<h3>${t('room',r.number)}</h3><div class="sub">${t('floor',r.floor)} · ${esc(typeName(r.type))} · ${t('personsN',r.capacity||2)}</div>
    <div class="row2"><div><label>${t('type')}</label><select id="r_t">${['standard','large'].map(k=>`<option value="${k}" ${(r.type===k||(k==='standard'&&r.type!=='large'))?'selected':''}>${t('t_'+k)}</option>`).join('')}</select></div><div><label>${t('capacity')}</label><input id="r_c" type="number" inputmode="numeric" min="1" value="${r.capacity||2}"></div></div>
    <label>${t('status')}</label><div><select id="rs">${Object.keys(STATUS_CLS).map(k=>`<option value="${k}" ${r.status===k?'selected':''}>${t('st_'+k)}</option>`).join('')}</select></div>
    <label>${t('priceDaily')} (${curLabel()})</label><input id="r_d" type="number" inputmode="decimal" step="any" min="0" value="${amt(r.price_daily)}">
    <div class="row2"><div><label>${t('weekly')} (${curLabel()})</label><input id="r_w" type="number" inputmode="decimal" step="any" min="0" value="${amt(r.price_weekly)}"></div><div><label>${t('monthly')} (${curLabel()})</label><input id="r_m" type="number" inputmode="decimal" step="any" min="0" value="${amt(r.price_monthly)}"></div></div>
    <label>${t('recent')}</label>${bs.map(b=>`<div class="kv"><span>${esc(guest(b.guest_id).full_name)}</span><span class="muted">${fmtD(b.check_in)} → ${fmtD(b.check_out)}</span></div>`).join('') || `<div class="muted">${t('none')}</div>`}
    <div class="acts"><button class="btn ghost" onclick="newBooking(${r.id})">${t('book')}</button><button class="btn" onclick="saveRoom(${r.id})">${t('save')}</button></div>`);
}
function saveRoom(rid){ const r=room(rid), v=(i)=>Math.max(0,fromView($(i).value));
  r.type=$('r_t').value; r.capacity=Math.max(1, +$('r_c').value||1);
  r.status=$('rs').value; r.price_daily=v('r_d'); r.price_weekly=v('r_w'); r.price_monthly=v('r_m'); closeM(); render(); toast(t('saved')); }
function resetSheet(){ openM(`<h3>${t('resetQ')}</h3><div class="sub" style="margin-top:8px">${t('resetText')}</div>
  <div class="acts"><button class="btn ghost" onclick="closeM()">${t('cancel')}</button><button class="btn" onclick="resetAll()">${t('resetYes')}</button></div>`); }

function newBooking(rid){
  const opts = db.rooms.filter(r=>r.status!=='maintenance').map(r=>`<option value="${r.id}" ${r.id===rid?'selected':''}>${r.number} — ${esc(typeName(r.type))}, ${t('personsN',r.capacity||2)} (${short(r.price_daily)})</option>`).join('');
  openM(`<h3>${t('newBookingT')}</h3>
    <label>${t('th_room')}</label><select id="b_room" onchange="quote()">${opts}</select>
    <div class="row2"><div><label>${t('checkIn')}</label><input type="date" id="b_in" value="${T}" onchange="quote()"></div><div><label>${t('checkOut')}</label><input type="date" id="b_out" value="${addD(1)}" onchange="quote()"></div></div>
    <label>${t('guest')}</label><select id="b_g" onchange="$('ng').style.display=this.value==='new'?'block':'none'"><option value="new">${t('newGuest')}</option>${db.guests.map(g=>`<option value="${g.id}">${esc(g.full_name)}</option>`).join('')}</select>
    <div id="ng"><div class="row2"><div><label>${t('th_name')}</label><input id="b_name" placeholder="${t('fullName')}"></div><div><label>${t('phone')}</label><input id="b_phone" type="tel" placeholder="+998"></div></div></div>
    <div class="row2"><div><label>${t('source')}</label><select id="b_src">${['direct','telegram','instagram','booking.com'].map(s=>`<option value="${s}">${srcName(s)}</option>`).join('')}</select></div><div><label>${t('prepay')} (${curLabel()})</label><input id="b_pre" type="number" inputmode="decimal" step="any" min="0" placeholder="0"></div></div>
    <label>${t('total')} (${curLabel()})</label><input id="b_total" type="number" inputmode="decimal" step="any" min="0">
    <div class="muted" id="quote" style="font-size:12px;margin-top:6px"></div>
    <div class="err" id="b_err"></div>
    <div class="acts"><button class="btn ghost" onclick="closeM()">${t('cancel')}</button><button class="btn" onclick="saveBooking()">${t('save')}</button></div>`);
  quote();
}
function quote(){
  const r=room(+$('b_room').value), a=$('b_in').value, b=$('b_out').value, n=nights(a,b), q=$('quote');
  if (!(n>0)) { q.textContent=t('pickDates'); return; }
  $('b_total').value = amt(calcPrice(r,a,b));
  q.innerHTML = `${t('nightsN',n)} · ${t(tariff(r,n))}${overlaps(r.id,a,b)?` · <b style="color:#d00">${t('busy')}</b>`:''}`;
}
function saveBooking(){
  const err=(m)=>$('b_err').textContent=m;
  const r=room(+$('b_room').value), a=$('b_in').value, b=$('b_out').value;
  if (!(nights(a,b)>0)) return err(t('errDates'));
  if (overlaps(r.id,a,b)) return err(t('busy'));
  let gid = $('b_g').value;
  if (gid==='new') { const name=$('b_name').value.trim(), phone=$('b_phone').value.trim();
    if (!name||!phone) return err(t('errGuest'));
    gid = nextId(db.guests); db.guests.push({ id:gid, full_name:name, phone, country:'' }); }
  const bid = nextId(db.bookings);
  const total = Math.max(0, fromView($('b_total').value));
  db.bookings.push({ id:bid, room_id:r.id, guest_id:+gid, check_in:a, check_out:b, total, status:'confirmed', source:$('b_src').value });
  const pre = fromView($('b_pre').value);
  if (pre>0) db.payments.push({ id:nextId(db.payments), booking_id:bid, amount:pre, method:'cash', date:T });
  closeM(); render(); toast(t('bookingCreated'));
}

function bookingSheet(bid){
  const b=db.bookings.find(x=>x.id===bid), g=guest(b.guest_id), r=room(b.room_id), ps=db.payments.filter(p=>p.booking_id===bid), bal=balanceOf(b);
  const actions = { pending:[['checked_in','checkin'],['cancelled','cancelBooking']], confirmed:[['checked_in','checkin'],['cancelled','cancelBooking']], checked_in:[['checked_out','checkout']] }[b.status]||[];
  openM(`<h3>${esc(g.full_name)}</h3><div class="sub">${t('room',r.number)} · ${pill(BST_CLS[b.status], t('bs_'+b.status))}</div>
    <div style="margin-top:14px">
      <div class="kv"><span class="muted">${t('th_dates')}</span><span>${fmtD(b.check_in)} → ${fmtD(b.check_out)} (${t('nightsN',nights(b.check_in,b.check_out))})</span></div>
      <div class="kv"><span class="muted">${t('phone')}</span><span class="num">${esc(g.phone)}</span></div>
      <div class="kv"><span class="muted">${t('total')}</span><b class="num">${money(b.total)}</b></div>
      <div class="kv"><span class="muted">${t('paid')}</span><span class="num">${money(paidOf(bid))}</span></div>
      <div class="kv"><span class="muted">${t('balance')}</span><b class="num">${money(Math.max(0,bal))}</b></div>
    </div>
    ${ps.length?`<label>${t('payments')}</label>${ps.map(p=>`<div class="kv"><span class="muted">${fmtD(p.date)} · ${t('m_'+p.method)}</span><span class="num">${money(p.amount)}</span></div>`).join('')}`:''}
    <div class="acts">${bal>0&&b.status!=='cancelled'?`<button class="btn ghost" onclick="paySheet(${bid})">${t('takePay')}</button>`:''}${actions.map(([s,l],i)=>`<button class="btn ${i?'ghost':''}" onclick="act(${bid},'${s}')">${t(l)}</button>`).join('')}</div>`);
}
function act(bid, s){
  const b=db.bookings.find(x=>x.id===bid); b.status=s;
  if (s==='checked_in') room(b.room_id).status='occupied';
  if (s==='checked_out') room(b.room_id).status='cleaning';
  closeM(); render(); toast(t({checked_in:'t_in',checked_out:'t_out',cancelled:'t_cancel'}[s]));
}

function paySheet(bid){
  const b=db.bookings.find(x=>x.id===bid);
  openM(`<h3>${t('takePay')}</h3><div class="sub">${t('room',room(b.room_id).number)} · ${esc(guest(b.guest_id).full_name)}</div>
    <label>${t('amount')} (${curLabel()})</label><input id="p_a" type="number" inputmode="decimal" step="any" value="${amt(Math.max(0,balanceOf(b)))}">
    <label>${t('method')}</label><select id="p_m">${METHODS.map(k=>`<option value="${k}">${t('m_'+k)}</option>`).join('')}</select>
    <div class="err" id="p_err"></div>
    <div class="acts"><button class="btn ghost" onclick="closeM()">${t('cancel')}</button><button class="btn" onclick="savePay(${bid})">${t('accept')}</button></div>`);
}
function savePay(bid){
  const a=fromView($('p_a').value); if (!(a>0)) return $('p_err').textContent=t('enterAmount');
  db.payments.push({ id:nextId(db.payments), booking_id:bid, amount:a, method:$('p_m').value, date:T });
  closeM(); render(); toast(t('payDone'));
}

function newExpense(){
  openM(`<h3>${t('newExpenseT')}</h3>
    <label>${t('category')}</label><select id="e_c">${CATS.map(c=>`<option value="${c}">${t('c_'+c)}</option>`).join('')}</select>
    <label>${t('amount')} (${curLabel()})</label><input id="e_a" type="number" inputmode="decimal" step="any" placeholder="0">
    <label>${t('note')}</label><input id="e_n" placeholder="${t('notePh')}">
    <div class="err" id="e_err"></div>
    <div class="acts"><button class="btn ghost" onclick="closeM()">${t('cancel')}</button><button class="btn" onclick="saveExpense()">${t('save')}</button></div>`);
}
function saveExpense(){
  const a=fromView($('e_a').value); if (!(a>0)) return $('e_err').textContent=t('enterAmount');
  db.expenses.push({ id:nextId(db.expenses), category:$('e_c').value, amount:a, date:T, note:$('e_n').value.trim() });
  closeM(); render(); toast(t('expAdded'));
}

function guestSheet(gid){
  const g=guest(gid), bs=db.bookings.filter(b=>b.guest_id===gid).sort((a,b)=>a.check_in<b.check_in?1:-1);
  openM(`<h3>${esc(g.full_name)}</h3><div class="sub num">${esc(g.phone)}</div>
    <label>${t('visits')}</label>${bs.map(b=>`<div class="kv" style="cursor:pointer" onclick="bookingSheet(${b.id})"><span><b>${room(b.room_id).number}</b> · ${fmtD(b.check_in)} → ${fmtD(b.check_out)}</span>${pill(BST_CLS[b.status], t('bs_'+b.status))}</div>`).join('') || `<div class="muted">${t('none')}</div>`}
    <div class="acts"><button class="btn" onclick="closeM()">${t('close')}</button></div>`);
}

// ---------- Render ----------
const VIEWS = { home:Home, rooms:Rooms, bookings:Bookings, guests:Guests, finance:Finance, reports:Reports };
function renderMain(keepFocus){
  const main=$('main');
  const pos = keepFocus && document.activeElement && document.activeElement.selectionStart;
  main.innerHTML = VIEWS[page]();
  if (keepFocus) { const s=main.querySelector('.search'); if (s) { s.focus(); try { s.setSelectionRange(pos,pos); } catch(e){} } }
}
function render(){ renderNav(); renderMain(); save(); }
function fromHash(){ const h=(location.hash||'').slice(1); if (VIEWS[h]) page=h; }
window.addEventListener('hashchange', ()=>{ fromHash(); render(); });
document.documentElement.lang = lang;
fromHash(); render(); cloudLoad();

</script>
</body>
